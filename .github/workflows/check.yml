name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build universal app
        run: ./scripts/build-app.sh
      - name: Verify architectures and signature
        run: |
          lipo dist/ProfileDock.app/Contents/MacOS/AccountDock -verify_arch arm64 x86_64
          codesign --verify --strict dist/ProfileDock.app
